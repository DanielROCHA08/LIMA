<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Formulário</title>
</head>
<body>
    <form id="meuFormulario" action="https://webhook.site/30552a8e-d10e-46fc-ac20-10c96c32f5ff" method="post">

    <label  for="nome">Nome:</label>
    <input 
        type="text"
        id="nome"
        name="nome"
        place holder="Digite seu nome"
        required
    >

    <label  for="email">E-mail</label>
    <input 
        type="email"
        id="email"
        name="email"
        place holder="e-mail@exemplo.com"
        required
    >

    <label  for="senha">Senha</label>
    <input 
        type="password"
        id="senha"
        name="senha"
        place holder="Digite sua senha"
        minlength="8"
        pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}"
        required
    >

    
    <label  for=idade">Idade</label>
    <input 
        type="number"
        id="idade"
        name="senha"
        place holder="Digite sua senha"
        min="0"
        max="120"
        step="1"
        
    >

        <button type="submit">Enviar</button>
    </form>
</body>
</html>
